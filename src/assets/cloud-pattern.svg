<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <defs>
    <!-- 实心如意云头、镂空回旋和飘带云尾；不包含参考图的棋盘格。 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#927346"/><stop offset=".34" stop-color="#d0b17a"/>
      <stop offset=".56" stop-color="#b28e57"/><stop offset=".76" stop-color="#dcc08b"/>
      <stop offset="1" stop-color="#947341"/>
    </linearGradient>
    <filter id="foil" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <mask id="cut">
      <rect width="420" height="210" fill="white"/>
