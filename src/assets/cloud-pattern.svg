      <path d="M66 185c-52 6-79 34-54 53 24 19 68 12 115 1 33-8 65-14 86-4-18-19-52-17-94-8-39 9-71 13-87 1-17-13-1-31 34-43Z"/>
      <path d="M174 232c43-12 82-9 83 11 0 23-62 22-66 48-3 12 11 20 22 22-30-20 4-30 27-38 59-20 34-58-66-43Z"/>
