        <path d="M57 99c-16-15-3-34 13-30"/>
      </g>
    </mask>
    <g id="cloud" fill="url(#gold)" filter="url(#foil)">
      <g mask="url(#cut)">
        <path d="M29 112C0 104 5 78 35 76 29 42 60 21 88 37 106 11 145 23 151 48 181 31 212 44 218 62 257 48 280 75 266 99 291 121 260 148 235 138 213 158 176 146 161 133 125 157 85 148 71 128 48 133 30 128 29 112Z"/>
